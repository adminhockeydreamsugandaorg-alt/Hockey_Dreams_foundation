<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hockey Dreams Uganda</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#fff}
header{background:#000;padding:10px 12px;position:sticky;top:0;z-index:20;border-bottom:3px solid #ffcc00}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
nav button{background:none;border:1px solid #444;color:#fff;padding:6px 8px;border-radius:12px;font-size:10px;cursor:pointer}
nav button.active{background:#ffcc00;color:#000;border-color:#ffcc00;font-weight:bold}
.hero{height:42vh;min-height:240px;position:relative;background:#111}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-text{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.75);padding:10px 14px;border-left:4px solid #ffcc00;border-radius:4px}
.board{margin:10px;padding:14px;border-radius:8px;position:relative;overflow:hidden}
.board.white{background:#fff;color:#111;border:1px solid #ddd}
.board.black{background:#151515;border:1px solid #333}
.board.little-bg{background:#fff;color:#111;border:2px solid #ffcc00}
.board.little-bg::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:url('community_small.jpg') center/cover no-repeat;opacity:0.18;z-index:0}
.board.little-bg > *{position:relative;z-index:1}
.page{display:none}.page.active{display:block}
.sub-nav{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.sub-nav button{padding:6px 12px;border-radius:16px;border:1px solid #ffcc00;background:transparent;color:#ffcc00;font-size:11px;cursor:pointer}
.sub-nav button.active{background:#ffcc00;color:#000}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
th{background:#ffcc00;color:#000;padding:6px 4px} td{padding:5px 4px;border-bottom:1px solid #333;text-align:center} td.team-name{text-align:left;font-weight:bold}
</style>
</head>
<body>
<header>
<div style="color:#ffcc00;font-weight:bold">🏑 Hockey Dreams Uganda</div>
<nav>
<button id="nav-home" class="active" onclick="showPage('home')">Home</button>
<button id="nav-about" onclick="showPage('about')">About</button>
<button id="nav-competition" onclick="showPage('competition')">Competition</button>
<button id="nav-programs" onclick="showPage('programs')">Programs</button>
<button id="nav-involved" onclick="showPage('involved')">Get Involved</button>
<button id="nav-news" onclick="showPage('news')">News</button>
<button id="nav-donate" onclick="showPage('donate')">Donate</button>
</nav>
</header>

<div id="page-home" class="page active">
<div class="hero"><img src="community_small.jpg"><div class="hero-text"><h2 style="color:#ffcc00">Uganda Hockey Community</h2><p>Growing the game</p></div></div>
<div class="board white"><h3>Welcome</h3><p style="font-size:13px">Hockey Dreams Foundation</p></div>
</div>

<div id="page-about" class="page"><div class="board white"><h3>About</h3></div></div>

<div id="page-competition" class="page">
<div class="board white little-bg">
<h3>Competitions</h3>
<div class="sub-nav">
<button id="btn-little" class="active" onclick="showComp('little')">Little Sticks Championship 2026</button>
<button id="btn-weekend" onclick="showComp('weekend')">Weekend League 2027</button>
</div>
<div id="comp-little">
<div class="sub-nav">
<button id="btn-l-teams" class="active" onclick="showLittle('teams')">Teams</button>
<button id="btn-l-fixtures" onclick="showLittle('fixtures')">Fixtures</button>
<button id="btn-l-results" onclick="showLittle('results')">Results</button>
<button id="btn-l-table" onclick="showLittle('table')">Table</button>
</div>
<div id="little-teams"><div class="board black"><div id="teams-list"></div></div></div>
<div id="little-fixtures" style="display:none"><div class="board black"><div id="fixtures-list"></div></div></div>
<div id="little-results" style="display:none"><div class="board black"><div id="results-list"></div></div></div>
<div id="little-table" style="display:none"><div class="board black"><h4 style="color:#ffcc00">Points Table - W3 D1 | GD>H2H>GF>GA</h4><div id="table-list"></div></div></div>
</div>
<div id="comp-weekend" style="display:none"><div class="board black"><h4>Coming Soon</h4></div></div>
</div>
</div>

<div id="page-programs" class="page"><div class="board white"><h3>Programs</h3></div></div>
<div id="page-involved" class="page"><div class="board white"><h3>Get Involved</h3></div></div>
<div id="page-news" class="page"><div class="board white"><h3>News</h3></div></div>
<div id="page-donate" class="page"><div class="board white"><h3>Donate</h3></div></div>

<script>
function showPage(n){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('header nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  document.getElementById('nav-'+n).classList.add('active');
}
function showComp(c){
  document.getElementById('comp-little').style.display=c==='little'?'block':'none';
  document.getElementById('comp-weekend').style.display=c==='weekend'?'block':'none';
  document.getElementById('btn-little').classList.toggle('active',c==='little');
  document.getElementById('btn-weekend').classList.toggle('active',c==='weekend');
}
function showLittle(t){
  ['teams','fixtures','results','table'].forEach(x=>{
    document.getElementById('little-'+x).style.display=x===t?'block':'none';
    document.getElementById('btn-l-'+x).classList.toggle('active',x===t);
  });
}
showPage('home'); showComp('little'); showLittle('teams');

const TEAMS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvOnePs7n1K6IYwdL-9jg0Q7dZBaMWgD03ghhDz5W9ySaamIz1aT_fCdS2Ctgi8KWE5cmwTVLtw77U/pub?gid=0&single=true&output=csv';
const HDF_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvOnePs7n1K6IYwdL-9jg0Q7dZBaMWgD03ghhDz5W9ySaamIz1aT_fCdS2Ctgi8KWE5cmwTVLtw77U/pub?gid=71633465&single=true&output=csv';
let allResultsData=[];

function splitCSVLine(line){
  // Handles "Team, Name" inside quotes
  let result=[], cur='', inQuote=false;
  for(let i=0;i<line.length;i++){
    let c=line[i];
    if(c==='"'){inQuote=!inQuote; continue;}
    if(c===',' && !inQuote){result.push(cur.trim()); cur='';} else cur+=c;
  }
  result.push(cur.trim());
  return result;
}

async function loadAll(){
  try{
    const r=await fetch(TEAMS_CSV); const t=await r.text();
    const rows=t.split('\n').filter(l=>l.trim()!=='').slice(1);
    let h='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    rows.forEach(l=>{let cols=splitCSVLine(l); let n=cols[0]; if(n&&!n.toLowerCase().includes('team')&&n.length>1) h+=`<div style="background:#222;border:1px solid #ffcc00;color:#fff;padding:6px 10px;border-radius:14px;font-size:11px">🏑 ${n}</div>`;});
    h+='</div>'; document.getElementById('teams-list').innerHTML=h;
  }catch(e){}

  try{
    const r2=await fetch(HDF_CSV); const t2=await r2.text();
    let lines=t2.split('\n').filter(l=>l.trim()!=='');
    if(lines.length<2) return;
    let header=splitCSVLine(lines[0]).map(h=>h.toLowerCase());
    console.log('HEADER FOUND:', header);

    // Auto-find column indexes - VERY FLEXIBLE
    let dateIdx = header.findIndex(h=>h.includes('date'));
    let timeIdx = header.findIndex(h=>h.includes('time'));
    let teamAIdx = header.findIndex(h=>h.includes('team a'));
    let teamBIdx = header.findIndex(h=>h.includes('team b'));
    let matchIdx = header.findIndex(h=>h.includes('match')||h.includes('fixture')||h.includes('game'));
    let venueIdx = header.findIndex(h=>h.includes('venue')||h.includes('ground')||h.includes('pitch'));
    let resultIdx = header.findIndex(h=>h.includes('result')||h.includes('score'));

    // Fallbacks if header names are missing
    if(dateIdx===-1) dateIdx=0;
    if(resultIdx===-1) resultIdx=header.length-1; // last column usually score

    let teamsStats={}; let fH='<table><tr><th>DATE</th><th>MATCH</th><th>TIME</th><th>VENUE</th></tr>'; let rH='<table><tr><th>DATE</th><th>MATCH</th><th>SCORE</th><th>VENUE</th></tr>'; let fc=0,rc=0; allResultsData=[];

    for(let i=1;i<lines.length;i++){
      let cols=splitCSVLine(lines[i]);
      if(cols.length<2) continue;
      let date = cols[dateIdx]||'';
      let time = timeIdx>=0?cols[timeIdx]||'':'';
      let teamA='', teamB='', venue=venueIdx>=0?cols[venueIdx]||'':'', result=resultIdx>=0?cols[resultIdx]||'':'';

      if(teamAIdx>=0 && teamBIdx>=0){
        teamA=cols[teamAIdx]||''; teamB=cols[teamBIdx]||'';
      } else if(matchIdx>=0){
        // Parse "Naguru vs Shimon" or "Naguru - Shimon"
        let matchStr=cols[matchIdx]||'';
        let parts=matchStr.split(/\s+vs\s+|\s+v\s+|\s*-\s+|\s+vs\.\s+/i);
        if(parts.length>=2){teamA=parts[0].trim(); teamB=parts[1].trim();}
        else {teamA=matchStr; teamB='';}
      } else {
        // Last resort: guess columns 1 and 2 are teams
        if(cols.length>=4){teamA=cols[1]||''; teamB=cols[2]||'';}
      }

      if(!teamA && !teamB) continue;
      if(teamA.toLowerCase().includes('team a')) continue;

      if(!teamsStats[teamA]) teamsStats[teamA]={team:teamA,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};
      if(teamB && !teamsStats[teamB]) teamsStats[teamB]={team:teamB,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};

      let isResult = result && result.trim()!=='' && result!=='-' && /[0-9]/.test(result);
      if(isResult){
        let sp=result.split(/[-:]/).map(s=>parseInt(s.trim()));
        if(sp.length>=2 && !isNaN(sp[0])){
          let ga=sp[0], gb=sp[1];
          if(teamA && teamB){ allResultsData.push({teamA,teamB,ga,gb}); teamsStats[teamA].P++; teamsStats[teamB].P++; teamsStats[teamA].GF+=ga; teamsStats[teamA].GA+=gb; teamsStats[teamB].GF+=gb; teamsStats[teamB].GA+=ga;
          if(ga>gb){teamsStats[teamA].W++; teamsStats[teamA].Pts+=3; teamsStats[teamB].L++;} else if(gb>ga){teamsStats[teamB].W++; teamsStats[teamB].Pts+=3; teamsStats[teamA].L++;} else {teamsStats[teamA].D++; teamsStats[teamB].D++; teamsStats[teamA].Pts++; teamsStats[teamB].Pts++;}}
        }
        rH+=`<tr><td>${date}</td><td>${teamA} vs ${teamB}</td><td style="color:#ffcc00;font-weight:bold">${result}</td><td>${venue}</td></tr>`; rc++;
      } else {
        // Fixture
        if(teamA && teamB){
          fH+=`<tr><td>${date}</td><td>${teamA} vs ${teamB}</td><td>${time}</td><td>${venue}</td></tr>`; fc++;
        }
      }
    }

    Object.values(teamsStats).forEach(s=>s.GD=s.GF-s.GA);
    let tableArr=Object.values(teamsStats).filter(s=>s.team);
    tableArr.sort((a,b)=>{if(b.Pts!==a.Pts) return b.Pts-a.Pts; if(b.GD!==a.GD) return b.GD-a.GD; let h2h=getH2H(a.team,b.team); if(h2h!==0) return h2h; if(b.GF!==a.GF) return b.GF-a.GF; return a.GA-b.GA;});
    fH+='</table>'; rH+='</table>';
    document.getElementById('fixtures-list').innerHTML=fc>0?fH:'No fixtures - all rows have scores. Clear RESULT column to make fixture.';
    document.getElementById('results-list').innerHTML=rc>0?rH:'No results yet';
    let tH='<table><tr><th>#</th><th style="text-align:left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>';
    tableArr.forEach((s,i)=>{tH+=`<tr><td>${i+1}</td><td class="team-name">${s.team}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td><td>${s.GF}</td><td>${s.GA}</td><td>${s.GD}</td><td style="color:#ffcc00;font-weight:bold">${s.Pts}</td></tr>`;});
    tH+='</table>';
    document.getElementById('table-list').innerHTML=tableArr.length?tH:'No table data';
  }catch(e){console.error(e)}
}
function getH2H(a,b){let pa=0,pb=0; allResultsData.forEach(m=>{if((m.teamA===a&&m.teamB===b)||(m.teamA===b&&m.teamB===a)){let ga=m.teamA===a?m.ga:m.gb, gb=m.teamA===a?m.gb:m.ga; if(ga>gb) pa+=3; else if(gb>ga) pb+=3; else {pa++; pb++;}}}); if(pa>pb) return -1; if(pb>pa) return 1; return 0;}
loadAll();
</script>
</body>
</html>
