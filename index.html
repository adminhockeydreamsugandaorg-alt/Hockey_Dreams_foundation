<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uganda Hockey Community</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#fff;min-height:100vh}
header{background:rgba(0,0,0,0.9);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;border-bottom:2px solid #ffcc00}
.logo{font-weight:bold;color:#ffcc00;font-size:18px}
nav button{background:none;border:1px solid #ffcc00;color:#ffcc00;padding:6px 10px;margin-left:4px;border-radius:4px;cursor:pointer;font-size:11px}
nav button:hover{background:#ffcc00;color:#000}
.hero{position:relative;height:35vh;min-height:220px;background:#111;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-text{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.7);padding:8px 12px;border-left:4px solid #ffcc00;border-radius:4px}
.board{margin:12px;padding:12px;border-radius:8px}
.board.white{background:#fff;color:#000}
.board.black{background:#151515;color:#fff;border:1px solid rgba(255,204,0,0.3)}
.tab{display:none}.tab.active{display:block}
table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
th{background:#ffcc00;color:#000;padding:6px 4px;text-align:center}
td{padding:5px 4px;border-bottom:1px solid #333;text-align:center}
td.team-name{text-align:left;font-weight:bold}
</style>
</head>
<body>
<header>
<div class="logo">🏑 Uganda Hockey</div>
<nav>
<button onclick="showPage('teams')">Teams</button>
<button onclick="showPage('fixtures')">Fixtures</button>
<button onclick="showPage('results')">Results</button>
<button onclick="showPage('table')">Table</button>
</nav>
</header>

<div class="hero">
<img src="community_small.jpg">
<div class="hero-text"><h3 style="color:#ffcc00">Little Sticks 2026</h3><p style="font-size:12px">Live from Google Sheets</p></div>
</div>

<div class="board black">
<div id="tab-teams" class="tab active">
<h4>Teams</h4><div id="teams-loading" style="color:#ffcc00;font-size:11px">Loading...</div><div id="teams-list"></div>
</div>
<div id="tab-fixtures" class="tab">
<h4>Fixtures</h4><div id="fixtures-loading" style="color:#ffcc00;font-size:11px">Loading...</div><div id="fixtures-list"></div>
</div>
<div id="tab-results" class="tab">
<h4>Results</h4><div id="results-loading" style="color:#ffcc00;font-size:11px">Loading...</div><div id="results-list"></div>
</div>
<div id="tab-table" class="tab">
<h4>Points Table - Auto Calculated</h4>
<p style="font-size:10px;opacity:0.6">Win=3 Draw=1 | Tie: GD > H2H > GF > GA</p>
<div id="table-loading" style="color:#ffcc00;font-size:11px">Calculating table...</div>
<div id="table-list"></div>
</div>
</div>

<script>
function showPage(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+n).classList.add('active');}
showPage('teams');

// === YOUR LINKS ===
const TEAMS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvOnePs7n1K6IYwdL-9jg0Q7dZBaMWgD03ghhDz5W9ySaamIz1aT_fCdS2Ctgi8KWE5cmwTVLtw77U/pub?output=csv';
// IMPORTANT: Replace this with your HDF sheet published link (the one from screenshot)
const HDF_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQvOnePs7n1K6IYwdL-9jg0Q7dZBaMWgD03ghhDz5W9ySaamIz1aT_fCdS2Ctgi8KWE5cmwTVLtw77U/pub?gid=0&single=true&output=csv';

let allResultsData = []; // for H2H calculation

async function loadAll(){
  try{
    const r=await fetch(TEAMS_CSV); const t=await r.text();
    const rows=t.split('\n').filter(l=>l.trim()!=='').slice(1);
    let h='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">';
    rows.forEach(l=>{let n=l.split(',')[0].replace(/"/g,'').trim(); if(n&&!n.toLowerCase().includes('team')) h+=`<div style="background:#222;border:1px solid #ffcc00;padding:6px 10px;border-radius:14px;font-size:11px">🏑 ${n}</div>`;});
    h+='</div>'; document.getElementById('teams-list').innerHTML=h; document.getElementById('teams-loading').style.display='none';
  }catch(e){}

  try{
    const r2=await fetch(HDF_CSV); const t2=await r2.text();
    const lines=t2.split('\n').filter(l=>l.trim()!==''); const data=lines.slice(1);
    
    let teamsStats = {}; // { teamName: {P,W,D,L,GF,GA,GD,Pts} }
    let fH='<table><tr><th>DATE</th><th>MATCH</th><th>TIME</th><th>VENUE</th></tr>';
    let rH='<table><tr><th>DATE</th><th>MATCH</th><th>SCORE</th><th>VENUE</th></tr>';
    let fc=0, rc=0;
    allResultsData=[];

    data.forEach(line=>{
      let cols=line.split(',').map(s=>s.replace(/^"|"$/g,'').trim());
      if(cols.length<4) return;
      let date=cols[0], time=cols[1], teamA=cols[2], teamB=cols[3], venue=cols[4]||'', result=cols[5]||'';
      if(!teamA || !teamB || teamA.toLowerCase()==='team a') return;
      
      // init teams
      if(!teamsStats[teamA]) teamsStats[teamA]={team:teamA,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};
      if(!teamsStats[teamB]) teamsStats[teamB]={team:teamB,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};

      if(result && result!=='' && result.toLowerCase()!=='result'){
        // Parse score like 2-1 or 2 : 1
        let scoreParts = result.split(/[-:]/).map(s=>parseInt(s.trim()));
        if(scoreParts.length>=2 && !isNaN(scoreParts[0]) && !isNaN(scoreParts[1])){
          let ga=scoreParts[0], gb=scoreParts[1];
          allResultsData.push({teamA,teamB,ga,gb});
          teamsStats[teamA].P++; teamsStats[teamB].P++;
          teamsStats[teamA].GF+=ga; teamsStats[teamA].GA+=gb;
          teamsStats[teamB].GF+=gb; teamsStats[teamB].GA+=ga;
          if(ga>gb){teamsStats[teamA].W++; teamsStats[teamA].Pts+=3; teamsStats[teamB].L++;}
          else if(gb>ga){teamsStats[teamB].W++; teamsStats[teamB].Pts+=3; teamsStats[teamA].L++;}
          else {teamsStats[teamA].D++; teamsStats[teamB].D++; teamsStats[teamA].Pts+=1; teamsStats[teamB].Pts+=1;}
        }
        rH+=`<tr><td>${date}</td><td>${teamA} vs ${teamB}</td><td style="color:#ffcc00;font-weight:bold">${result}</td><td>${venue}</td></tr>`; rc++;
      } else {
        fH+=`<tr><td>${date}</td><td>${teamA} vs ${teamB}</td><td>${time}</td><td>${venue}</td></tr>`; fc++;
      }
    });

    // Calculate GD
    Object.values(teamsStats).forEach(s=>{s.GD=s.GF-s.GA;});

    // Sort: Pts > GD > H2H > GF > GA asc
    let tableArray = Object.values(teamsStats);
    tableArray.sort((a,b)=>{
      if(b.Pts!==a.Pts) return b.Pts-a.Pts;
      if(b.GD!==a.GD) return b.GD-a.GD;
      // Head to Head
      let h2h = getHeadToHead(a.team,b.team);
      if(h2h!==0) return h2h;
      if(b.GF!==a.GF) return b.GF-a.GF;
      return a.GA-b.GA;
    });

    fH+='</table>'; rH+='</table>';
    document.getElementById('fixtures-list').innerHTML=fc?fH:'<p style="font-size:11px;opacity:0.6">No fixtures</p>';
    document.getElementById('results-list').innerHTML=rc?rH:'<p style="font-size:11px;opacity:0.6">No results yet</p>';
    document.getElementById('fixtures-loading').style.display='none';
    document.getElementById('results-loading').style.display='none';

    // Render Table
    let tH='<table><tr><th>#</th><th style="text-align:left">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr>';
    tableArray.forEach((s,i)=>{
      tH+=`<tr><td>${i+1}</td><td class="team-name">${s.team}</td><td>${s.P}</td><td>${s.W}</td><td>${s.D}</td><td>${s.L}</td><td>${s.GF}</td><td>${s.GA}</td><td>${s.GD}</td><td style="color:#ffcc00;font-weight:bold">${s.Pts}</td></tr>`;
    });
    tH+='</table>';
    document.getElementById('table-list').innerHTML=tableArray.length?tH:'<p style="font-size:11px">No results yet - Table will auto appear after you add scores</p>';
    document.getElementById('table-loading').style.display='none';

  }catch(e){console.error(e)}
}

function getHeadToHead(teamA,teamB){
  // Find matches between these two teams
  let ptsA=0, ptsB=0;
  allResultsData.forEach(m=>{
    if((m.teamA===teamA && m.teamB===teamB) || (m.teamA===teamB && m.teamB===teamA)){
      let ga = m.teamA===teamA ? m.ga : m.gb;
      let gb = m.teamA===teamA ? m.gb : m.ga;
      if(ga>gb) ptsA+=3; else if(gb>ga) ptsB+=3; else {ptsA+=1; ptsB+=1;}
    }
  });
  if(ptsA>ptsB) return -1; // A ahead
  if(ptsB>ptsA) return 1;  // B ahead
  return 0;
}

loadAll();
</script>
</body>
</html>
